[project]
name = "swar"
version = "0.1.0"
description = "A reliability layer for Indian voice agents: the right speech model for every language, switched mid-call."
readme = "README.md"
authors = [{ name = "Sehaj Preet" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pipecat-ai[runner,silero,webrtc]>=1.15.0",
    "pydantic-settings>=2.6",
    "soxr>=0.5",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # modern Python syntax
    "B",        # bugbear: likely bugs
    "SIM",      # simplifications
    "ASYNC",    # blocking calls inside async code (CLAUDE.md principle 7)
    "RUF",      # ruff-specific
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
